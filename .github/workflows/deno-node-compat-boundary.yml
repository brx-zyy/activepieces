name: Deno Node compatibility boundary tests

on:
  push:
    branches:
      - security/deno-node-compat-boundary-tests

permissions:
  contents: read

jobs:
  sandbox-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Run Deno sandbox boundary tests
        working-directory: packages/server/engine
        run: bun run test -- test/core/code/deno-code-sandbox.test.ts
